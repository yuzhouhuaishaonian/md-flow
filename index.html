<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Flowchart · Markdown to Image</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="vendor/codemirror/lib/codemirror.min.css" />
  <link rel="stylesheet" href="vendor/codemirror/theme/material-darker.min.css" />
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>MD Flowchart</h1>
      <span class="subtitle">Enter Markdown → Auto-generate flowchart → Download image</span>
    </div>
    <div class="header-actions">
      <label class="btn btn-ghost" for="file-input">Open .md</label>
      <input id="file-input" type="file" accept=".md,.markdown,.txt" hidden />
      <button class="btn btn-ghost" id="btn-save-md" type="button">Save .md</button>
      <div class="divider"></div>
      <button class="btn btn-primary" id="btn-generate" type="button">Generate image</button>
      <button class="btn btn-ghost" id="btn-export-svg" type="button">SVG</button>
      <button class="btn btn-ghost" id="btn-export-pdf" type="button">PDF</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel editor-panel">
      <div class="panel-header">
        <span>Markdown Editor</span>
        <button class="btn-link" id="btn-insert-template" type="button">Flowchart example</button>
        <button class="btn-link" id="btn-insert-sql-template" type="button">Table schema example</button>
      </div>
      <div id="editor"></div>
    </section>

    <div class="resizer" id="resizer" aria-hidden="true"></div>

    <section class="panel preview-panel">
      <div class="panel-header">
        <span>Preview</span>
        <span class="diagram-count" id="diagram-status">Waiting for input</span>
      </div>
      <div class="preview-wrap">
        <article id="preview" class="preview-content"></article>
      </div>
    </section>
  </main>

  <div id="offscreen-render" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/codemirror/lib/codemirror.min.js"></script>
  <script src="vendor/codemirror/mode/markdown/markdown.min.js"></script>
  <script src="vendor/marked/marked.min.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="vendor/jspdf/jspdf.umd.min.js"></script>
  <script src="js/md-to-flowchart.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
